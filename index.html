<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Prompt Evaluation Tool</title>
    <link rel="stylesheet" href="/static/stylesheet.css">
</head>
<main class="container">

    <!-- IMPORT -->
    <section class="card">
        <h2>Importer</h2>
        <input type="file" id="fichier" accept=".txt">
        <button onclick="chargerFichier()">Upload Filer</button>
        <button onclick="evaluer()">Eval Presupposition</button>
        <div id="liste-phrases"></div>
    </section>
    <section class="card">
        <h2>Prompt</h2>

        <textarea id="prompt" placeholder="Une phrase par ligne..."></textarea>

        <label>Catégorie</label>
        <select id="categorie">
            <option value="definie">Définie</option>
            <option value="demonstrative">Démonstrative</option>
            <option value="possessive">Possessive</option>
            <option value="nom_propre">Nom propre</option>
            <option value="quantifieur">Quantifieur</option>
            <option value="generique">Générique</option>
        </select>

        <button onclick="analyser()">Analyses</button>
    </section>
<body>
</body>
